<style>
  :root{
    --bg:#F2F8FC; --bg2:#E3F0FA; --card:#FFFFFF; --card2:#EAF4FC;
    --line:#D8E8F5; --txt:#2F4156; --sub:#6B8298; --dim:#93A9BC;
    --acc:#4EA8DE; --acc2:#2F8FD0; --ok:#3E9B8F; --warn:#E0A63B; --danger:#E05C50;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .hidden{display:none!important}

  /* ===== 通用卡片 ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}

  /* ===== 认证视图 ===== */
  .auth-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;background:radial-gradient(900px 500px at 50% -10%,#DFF0FC 0%,var(--bg) 60%);
  }
  .auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(70,130,190,.14)}
  .auth-logo{text-align:center;margin-bottom:18px}
  .auth-logo .icon{font-size:40px;line-height:1}
  .auth-logo .ip-avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;display:inline-block;box-shadow:0 6px 16px rgba(90,160,220,.22);vertical-align:middle}
  .msg .sticker{height:76px;width:76px;border-radius:14px;object-fit:cover;margin-top:6px;display:block}
  .auth-logo h1{font-size:22px;font-weight:800;margin-top:6px}
  .auth-logo p{color:var(--sub);font-size:13px;margin-top:4px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:600}
  .field input,.field select{
    width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;color:var(--txt);font-size:14.5px;outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--acc)}
  .btn{
    width:100%;background:var(--acc);color:#FFFFFF;border:0;border-radius:10px;
    padding:12px;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px;
  }
  .rem-row{display:flex;gap:18px;margin:10px 0 2px}
  .rem-item{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .rem-item input{accent-color:var(--acc);width:15px;height:15px;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub);font-weight:600}
  .auth-switch{display:flex;gap:10px;margin-top:14px}
  .auth-switch button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
  .auth-switch button:active{transform:scale(.98)}
  .auth-msg{font-size:12.5px;color:var(--danger);min-height:18px;margin-top:8px;text-align:center}
  .auth-msg.ok{color:var(--ok)}
  .acct-box{background:var(--bg2);border:1px dashed var(--acc);border-radius:10px;padding:14px;text-align:center;margin:10px 0}
  .acct-box .big{font-size:26px;font-weight:900;color:var(--acc2);letter-spacing:.08em}
  .acct-box .tip{font-size:12px;color:var(--sub);margin-top:6px}
  .adm-user-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .adm-user-info{flex:1;min-width:0}
  .adm-user-name{font-size:14px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .adm-tag{font-size:10.5px;color:var(--acc2);background:rgba(126,196,234,.15);border:1px solid rgba(126,196,234,.4);border-radius:8px;padding:1px 7px;font-weight:600}
  .adm-user-acct{font-size:12px;color:var(--sub);margin-top:2px}
  .adm-user-ops{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .mini-btn{background:var(--card);border:1px solid var(--line);color:var(--acc2);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:600}
  .mini-btn:active{transform:scale(.96)}
  .mini-btn.danger{color:#c0392b;border-color:rgba(192,57,43,.35);background:rgba(192,57,43,.05)}
  .plan-panel{max-width:560px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .plan-toast{position:sticky;top:0;z-index:5;background:rgba(46,160,67,.95);color:#fff;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;margin-bottom:8px;text-align:center}
  .plan-sec-title{font-size:13px;font-weight:700;color:var(--txt);margin:14px 0 8px;padding-top:12px;border-top:1px dashed var(--line)}
  .plan-sec-title:first-of-type{border-top:0}
  .plan-proj-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
  .plan-proj-row .nm{flex:1;font-size:13.5px;font-weight:600}
  .plan-week-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
  .plan-dow{font-size:13px;font-weight:800;color:var(--acc2);width:40px}
  .plan-txt{flex:1;font-size:13px;color:var(--txt);min-width:0}
  .plan-txt .sub{color:var(--sub);font-size:12px}
  .act-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:6px;font-size:13px}
  .act-row .idx{color:var(--sub);width:18px;text-align:right}
  .act-row .nm{flex:1;font-weight:600}
  .act-row .spec{color:var(--acc2);font-weight:600}
  .act-row .grip{color:var(--sub);cursor:grab;font-size:14px;user-select:none;-webkit-user-select:none;flex:0 0 auto}
  .act-row[draggable=true]{cursor:grab}
  .act-row.dragging{opacity:.45;border-style:dashed}
  .act-edit{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--acc);border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:13px}
  .act-edit input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--txt);font-size:13px;outline:none;min-width:0}
  .act-edit input:focus{border-color:var(--acc)}
  .act-add-line{display:flex;gap:6px;margin:8px 0}
  .act-add-line input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 9px;color:var(--txt);font-size:13px;outline:none}
  .act-add-line input:focus{border-color:var(--acc)}
  .plan-ai-ok{color:var(--ok)}

  /* ===== 主应用 ===== */
  .app{max-width:760px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
  .app-top{
    padding:14px 16px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line);background:var(--bg2);
  }
  .app-top .logo{font-weight:800;font-size:15px}
  .app-top .logo em{color:var(--acc);font-style:normal}
  .app-top .spacer{flex:1}
  .chip{font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 10px}
  .icon-btn{background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer}
  .icon-btn:active{transform:scale(.96)}

  /* 聊天区 */
  .chat{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px}
  .chat-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 6px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
  .chat-head b{color:var(--sub);font-size:12.5px}
  .chat-head button{background:transparent;border:0;color:var(--acc2);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:8px}
  .chat-head button:active{background:var(--card)}
  .msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.ai{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}
  .msg.me{background:var(--acc);color:#FFFFFF;font-weight:600;border-top-right-radius:4px}
  .msg .who{font-size:11px;color:var(--dim);display:block;margin-bottom:3px;font-weight:600}
  .msg.me .who{color:rgba(255,255,255,.75)}
  /* 聊天头像 */
  .mrow{display:flex;align-items:flex-end;gap:8px}
  .mrow.me{flex-direction:row-reverse}
  .mav{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex-shrink:0;background:var(--card)}
  .mav.ph{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--acc2)}

  /* 总结卡片（紧凑版：一屏内完整显示） */
  .sum-card{background:linear-gradient(135deg,#4EA8DE 0%,#7B6FE8 100%);border-radius:16px;padding:12px 14px 11px;margin-top:8px;font-size:13px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(43,127,184,.2)}
  .sum-card::before{content:"";position:absolute;top:-60px;right:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.15);filter:blur(6px)}
  .sum-head{display:flex;align-items:center;gap:8px;position:relative}
  .sum-ava{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#fff;padding:2px}
  .sum-head b{display:block;font-size:13.5px;font-weight:800;line-height:1.15}
  .sum-head small{font-size:10px;opacity:.82;margin-top:1px}
  .sum-main{display:flex;align-items:center;justify-content:space-between;margin:8px 0 7px;position:relative}
  .sum-proj{font-size:19px;font-weight:900;letter-spacing:.5px}
  .sum-stat{font-size:11px;font-weight:800;background:rgba(255,255,255,.22);border-radius:20px;padding:3px 10px}
  .sum-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:relative}
  .sum-grid4 .cell{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 3px;text-align:center}
  .sum-grid4 .cell b{display:block;font-size:15px;font-weight:900;color:#fff}
  .sum-grid4 .cell span{font-size:9.5px;opacity:.78}
  .sum-streak{background:rgba(255,255,255,.1);border-radius:10px;padding:7px 10px;margin-top:8px;position:relative}
  .sum-streak .srow{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:800;color:#fff}
  .sum-streak .track{height:5px;background:rgba(255,255,255,.2);border-radius:4px;margin:5px 0 0;overflow:hidden}
  .sum-streak .track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#FFD37A,#FF9F5A)}
  .sum-streak .ssub{font-size:10px;font-weight:600;opacity:.85}
  /* 月度总结独立白卡（保持清爽可读） */
  .mcard{background:var(--card2);border:1px solid var(--ok);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:13.5px}
  .mcard .m-title{font-size:14px;font-weight:800;margin-bottom:6px;color:var(--acc2)}
  .mcard .row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
  .mcard .row b{color:var(--acc2)}
  /* 徽章入口（我的页面·账号下方） */
  .badge-entry{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:linear-gradient(135deg,#EAF5FF,#D9ECFF);border:1px solid var(--line);border-radius:14px;margin:2px 0 12px;cursor:pointer;color:var(--ink);text-align:left}
  .badge-entry .be-icon{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7FC4EA,#4EA8DE 60%,#2B7FB8);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 10px rgba(43,127,184,.3)}
  .badge-entry .be-txt{flex:1}
  .badge-entry .be-txt b{display:block;font-size:15px;color:#17324D}
  .badge-entry .be-txt small{color:var(--sub);font-size:12px}
  .badge-entry .arrow{color:var(--dim);font-size:15px}
  /* 徽章墙 */
  .badge-view{padding:14px;overflow-y:auto;flex:1}
  .badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px 14px;text-align:center}
  .badge .b-icon{width:76px;height:76px;margin:0 auto 10px;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 6px 16px rgba(43,127,184,.22);cursor:pointer}
  .badge .b-icon img{width:100%;height:100%;object-fit:cover;display:block}
  .badge .b-icon .b-dim{filter:grayscale(.92) brightness(.78);opacity:.75}
  .badge .b-icon .b-lock{position:absolute;right:-2px;bottom:-2px;font-size:15px;background:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .badge .b-name{font-size:14px;font-weight:800;color:var(--txt)}
  .badge .b-desc{font-size:11px;color:var(--dim);margin-top:3px}
  .badge .b-state{font-size:11.5px;font-weight:800;margin-top:8px;color:#6FBF7F}
  .badge.lock .b-state{color:var(--dim)}
  @media (max-width:480px){.badge-grid{grid-template-columns:repeat(2,1fr)}}
  /* 徽章3D预览弹窗 */
  .bprev-mask{position:fixed;inset:0;z-index:90;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center}
  .bprev-stage{width:min(340px,84vw);text-align:center}
  .bprev-scene{perspective:900px}
  .bprev-card{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.4,.2,.2,1);cursor:grab}
  .bprev-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .bprev-face.front{background:radial-gradient(circle at 35% 25%,#EAF6FF,#BFE3F7 60%,#9CCFEA);border:1px solid rgba(255,255,255,.6)}
  .bprev-face.front img{width:100%;height:100%;object-fit:cover;display:block}
  .bprev-name{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:14px;font-weight:900;color:#2B7FB8;background:rgba(255,255,255,.82);padding:8px 0;letter-spacing:.05em}
  .bprev-face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#2B7FB8,#4EA8DE 70%,#7FC4EA);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .bprev-face.back .bb-ava{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.7);margin-bottom:12px;object-fit:cover}
  .bb-title{font-size:20px;font-weight:900;letter-spacing:.06em}
  .bb-date{font-size:13.5px;margin-top:10px;opacity:.95;font-weight:700}
  .bb-line{font-size:12.5px;margin-top:12px;opacity:.85;line-height:1.5}
  .bprev-hint{color:#CDE6F7;font-size:12px;margin:16px 0 10px}
  .bprev-ops{display:flex;gap:10px;justify-content:center}
  .bprev-ops button{flex:1;max-width:120px;padding:11px 0;border:0;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;background:#fff;color:#2B7FB8}
  .bprev-ops button:active{transform:scale(.96)}
  .sum-card .sum-title{font-weight:800;color:var(--ok);margin-bottom:6px;font-size:14px}
  .sum-card .row{display:flex;justify-content:space-between;padding:3px 0;color:var(--sub)}
  .sum-card .row b{color:var(--txt)}

  /* 快捷输入区 */
  .quick-inputs{display:flex;gap:8px;padding:0 14px 8px;flex-wrap:wrap}
  .qchip{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px;font-size:13.5px;color:var(--acc2);cursor:pointer}
  .qchip:active{transform:scale(.96)}

  /* 输入栏 */
  .input-bar{display:flex;gap:8px;padding:10px 14px 16px;border-top:1px solid var(--line);background:var(--bg2)}
  .input-bar input{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:11px 16px;color:var(--txt);font-size:14.5px;outline:none;
  }
  .input-bar input:focus{border-color:var(--acc)}
  .input-bar .send{width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:#FFFFFF;font-size:18px;cursor:pointer;font-weight:800}
  .input-bar .send:active{transform:scale(.95)}

  /* 打卡按钮 */
  .checkin-bar{padding:0 14px 12px;border-top:1px solid var(--line);background:var(--bg2)}
  .checkin-btn{
    width:100%;background:linear-gradient(135deg,#4EA8DE 0%,#7FC4EA 100%);border:0;border-radius:14px;
    padding:15px;font-size:16px;font-weight:900;color:#FFFFFF;cursor:pointer;letter-spacing:.05em;
    box-shadow:0 6px 20px rgba(232,135,74,.30);
  }
  .checkin-btn:active{transform:scale(.99)}
  .checkin-btn small{display:block;font-weight:600;font-size:12px;opacity:.8;margin-top:2px}

  /* 项目选择面板 */
  .panel-mask{position:fixed;inset:0;background:rgba(70,55,40,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .panel{width:100%;max-width:760px;background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 18px 26px}
  .panel h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .panel h3 .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:20px;padding:2px 8px}
  .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:40vh;overflow-y:auto}
  .proj-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:center}
  .proj-card:active{transform:scale(.97);border-color:var(--acc)}
  .proj-card .em{font-size:24px}
  .proj-card .nm{font-size:13.5px;font-weight:700;margin-top:4px}
  .proj-card .cnt{font-size:11.5px;color:var(--dim);margin-top:2px}
  .proj-card .undo{display:inline-block;margin-left:6px;padding:2px 8px;font-size:11px;color:#1c7ed6;background:#e7f5ff;border:1px solid #b3d9f7;border-radius:8px;cursor:pointer}
  .proj-card .undo:hover{background:#d0ebff}
  .panel .manage-line{display:flex;gap:8px;margin-top:14px}
  .panel .manage-line input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt);font-size:13.5px;outline:none}
  .panel .manage-line button{background:var(--bg2);border:1px solid var(--line);color:var(--acc2);border-radius:10px;padding:10px 14px;font-size:13px;cursor:pointer}
  .proj-ops{display:flex;gap:6px;margin-top:8px}
  .proj-ops button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--acc2);border-radius:8px;padding:6px 0;font-size:12px;cursor:pointer}
  .proj-ops button.del{color:var(--danger)}
  .proj-card.manage-mode{background:var(--bg2)}

  /* 计时面板 */
  .timer-panel{text-align:center}
  .timer-display{font-size:46px;font-weight:900;letter-spacing:3px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--acc2);margin:14px 0 4px;line-height:1.2}
  .timer-hint{color:var(--sub);font-size:13px;margin-bottom:14px}
  .timer-stop{background:var(--danger)!important;box-shadow:0 6px 20px rgba(217,87,74,.28)!important}

  /* 统计视图 */
  .stats{padding:14px;overflow-y:auto;flex:1}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .stat-cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .stat-cell .v{font-size:26px;font-weight:900;color:var(--acc2)}
  .stat-cell .k{font-size:12px;color:var(--sub);margin-top:2px}
  .chart-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .chart-box h4{font-size:13.5px;margin-bottom:6px;color:var(--sub);font-weight:700}
  .bchart{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:6px}
  .bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center;gap:4px;min-width:0}
  .bbar{width:70%;background:linear-gradient(180deg,#7FC4EA,#4EA8DE);border-radius:4px 4px 0 0;min-height:2px}
  .bcol span{font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .ratio-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;color:var(--sub)}
  .ratio-row b{color:var(--txt)}
  .ratio-row em{font-style:normal;font-size:11px;color:var(--acc2);width:34px;text-align:right}
  .ratio-track{flex:1;height:10px;background:var(--bg2);border-radius:5px;overflow:hidden}
  .ratio-fill{height:100%;border-radius:5px}
  .proj-list-stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .proj-list-stat .row{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
  .proj-list-stat .row:last-child{border:0}
  .proj-list-stat b{color:var(--acc2)}
  /* 打卡热力图 */
  .heat-box{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
  .heat-month{font-size:12.5px;font-weight:800;color:var(--sub);margin-top:4px}
  .heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;min-width:300px}
  .heat-cell{aspect-ratio:1;border-radius:4px;background:#E7EDF4}
  .heat-cell.t1{background:#C9E4F7}
  .heat-cell.t2{background:#9CCFE9}
  .heat-cell.t3{background:#6FB6DE}
  .heat-cell.t5{background:#1F76AD}
  .heat-legend{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--dim);margin-top:8px;justify-content:flex-end}
  .heat-legend i{width:11px;height:11px;border-radius:3px;background:#E7EDF4;display:inline-block}
  .heat-legend i.t1{background:#C9E4F7}.heat-legend i.t3{background:#6FB6DE}.heat-legend i.t5{background:#1F76AD}

  /* 管理面板占位 */
  .admin-panel{padding:14px;overflow-y:auto;flex:1}
  .admin-panel .tip{color:var(--sub);font-size:13.5px;text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:12px}

  /* 训练/学习记录视图 */  .records{padding:14px;overflow-y:auto;flex:1}
  .rec-head{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:var(--sub)}
  .rec-head b{color:var(--acc2);font-size:16px}
  .rec-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .rec-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rec-kind{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:20px}
  .rec-kind.k-锻炼{background:rgba(232,135,74,.16);color:var(--acc2)}
  .rec-kind.k-学习{background:rgba(103,187,116,.16);color:#6FBF7F}
  .rec-kind.k-漏卡{background:rgba(226,109,92,.16);color:#E26D5C}
  .rec-kind.k-月度总结{background:rgba(78,168,222,.16);color:#3F96C8}
  .rec-kind.k-打卡{background:rgba(78,168,222,.18);color:#2B7FB8}
  .rec-title{font-size:15.5px;font-weight:800;color:var(--txt)}
  .rec-status{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--sub)}
  .rec-status.done{color:#6FBF7F;border-color:rgba(103,187,116,.4);background:rgba(103,187,116,.08)}
  .rec-status.miss{color:#E26D5C;border-color:rgba(226,109,92,.4);background:rgba(226,109,92,.08)}
  .rec-detail{font-size:13px;color:var(--sub);margin-top:6px}
  .rec-time{font-size:11px;color:var(--dim);margin-top:6px}
  .rec-empty{padding:50px 20px;text-align:center;color:var(--dim);font-size:13.5px;border:1px dashed var(--line);border-radius:12px}

  /* 打卡日历 */
  .cal-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head b{font-size:15px;color:var(--txt)}
  .cal-nav{display:flex;gap:8px}
  .cal-nav button{background:var(--bg2);border:1px solid var(--line);color:var(--acc2);border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer;line-height:1}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-dow{text-align:center;font-size:11.5px;color:var(--dim);padding:4px 0;font-weight:700}
  .cal-cell{min-height:54px;border-radius:10px;background:var(--bg2);border:1px solid transparent;padding:5px;display:flex;flex-direction:column;gap:3px;position:relative}
  .cal-cell.blank{background:transparent;border:0;min-height:0}
  .cal-cell .d{font-size:12px;font-weight:700;color:var(--sub)}
  .cal-cell.future{opacity:.4}
  .cal-cell.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
  .cal-cell.has{background:rgba(78,168,222,.12);border-color:rgba(78,168,222,.35);cursor:pointer}
  .cal-cell.miss{cursor:pointer;border-style:dashed;border-color:rgba(224,166,59,.55);background:rgba(224,166,59,.07)}
  .cal-cell.has:active,.cal-cell.miss:active{transform:scale(.97)}
  .cal-tag{font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;background:var(--acc);color:#fff;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-tag.t-learn{background:#6FBF7F}
  .cal-cell .addhint{position:absolute;right:4px;bottom:3px;font-size:11px;color:var(--warn);font-weight:800}
  .cal-legend{display:flex;gap:14px;margin-top:12px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
  .cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  /* 补卡面板 */
  .bf-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .bf-proj{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--txt);cursor:pointer}
  .bf-proj.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .bf-note{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--txt);outline:none;box-sizing:border-box}
  .bf-note:focus{border-color:var(--acc)}
  .bf-confirm{width:100%;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px}
  .bf-confirm:active{transform:scale(.98)}
  .bf-day{font-size:12.5px;color:var(--dim);margin:2px 0 6px}
  .bf-det{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13.5px;color:var(--txt)}
  .rec-saved{font-size:12px;color:#6FBF7F;background:rgba(103,187,116,.08);border:1px solid rgba(103,187,116,.3);border-radius:20px;padding:4px 12px;width:fit-content;align-self:flex-start;margin-top:2px}

  /* 对话历史面板 */
  .hist-panel .panel{padding-bottom:10px}
  .hist-list{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .hist-day{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:13.5px;color:var(--txt)}
  .hist-day:active{background:var(--card)}
  .hist-day small{color:var(--dim);font-size:11.5px}
  .hist-back{display:block;width:100%;margin-top:10px;text-align:center;color:var(--acc2);font-weight:700;font-size:13px;cursor:pointer;padding:6px}
  .hist-empty{padding:24px 10px;text-align:center;color:var(--dim);font-size:13px}

  .nav-tabs{display:flex;border-top:1px solid var(--line);background:var(--bg2)}
  .nav-tabs button{flex:1;padding:11px;background:transparent;border:0;color:var(--dim);font-size:13.5px;font-weight:700;cursor:pointer}
  .nav-tabs button.on{color:var(--acc2);box-shadow:inset 0 -2px 0 var(--acc)}
  /* 我的（个人信息 + 记录/统计入口） */
  .mine-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:12px}
  .mine-avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);background:var(--card);cursor:pointer;display:block;margin:0 auto 10px}
  .mine-avatar.ph{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--acc2)}
  .mine-name{font-size:17px;font-weight:800;text-align:center}
  .mine-acct{font-size:12.5px;color:var(--dim);text-align:center;margin-top:2px}
  .mine-days{text-align:center;font-size:12.5px;color:var(--sub);margin-top:10px;padding:9px;background:var(--bg2);border-radius:10px}
  .mine-menu{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  .mine-menu-item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--sub);font-size:14.5px;font-weight:700;cursor:pointer}
  .mine-menu-item:active{background:var(--bg2)}
  .mine-menu-item.danger{color:#D57E8E}
  .mine-menu-item .arrow{color:var(--dim);font-size:15px}
  .back-row{display:flex;align-items:center;margin-bottom:10px}

  @media (max-width:480px){
    .msg{max-width:88%}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>

<!-- ===== 认证视图 ===== -->
<div class="auth-wrap" id="authView">

    <!-- 登录 -->
    <div id="viewLogin">
      <div class="field"><label>账号</label><input id="loginAcct" placeholder="例如 83725" autocomplete="username"></div>
      <div class="field"><label>密码</label><input id="loginPwd" type="password" placeholder="输入密码" autocomplete="current-password"></div>
      <div class="rem-row">
        <label class="rem-item"><input type="checkbox" id="remAcct" checked> 记住账号</label>
        <label class="rem-item"><input type="checkbox" id="remPwd"> 记住密码</label>
      </div>
      <button class="btn" onclick="doLogin()">登 录</button>
      <div class="auth-switch">
        <button onclick="showAuth('reg')">没有账号？注册</button>
        <button onclick="showAuth('forgot')">忘记密码</button>
      </div>
      <div class="auth-msg" id="loginMsg"></div>
    </div>

    <!-- 注册 -->
    <div id="viewReg" class="hidden">
      <div class="field"><label>怎么称呼你（昵称）</label><input id="regName" placeholder="例如：老王"></div>
      <div class="field hidden" id="regAcctWrap"><label>账号（可自己定，不填则随机发放）</label><input id="regAcct" placeholder="2-12位字母或数字，如 XiaoWang88"></div>
      <div class="field"><label>设置密码</label><input id="regPwd" type="password" placeholder="至少 6 位"></div>
      <div class="field"><label>确认密码</label><input id="regPwd2" type="password" placeholder="再输一遍"></div>
      <div class="field"><label>密保问题（忘记密码时用）</label>
        <select id="regQ">
          <option>你养的第一只宠物叫什么？</option>
          <option>你母亲的出生城市是？</option>
          <option>你最喜欢的运动是什么？</option>
          <option>你的小学名称是？</option>
          <option>自定义问题</option>
        </select>
      </div>
      <div class="field hidden" id="regQCustomWrap"><label>自定义问题</label><input id="regQCustom" placeholder="输入你的问题"></div>
      <div class="field"><label>密保答案</label><input id="regA" placeholder="答案（请牢记）"></div>
      <button class="btn" onclick="doRegister()">注 册</button>
      <div class="auth-switch"><button onclick="showAuth('login')">← 返回登录</button></div>
      <div class="auth-msg" id="regMsg"></div>
    </div>

    <!-- 找回密码 -->
    <div id="viewForgot" class="hidden">
      <div class="field"><label>账号</label><input id="fgtAcct" placeholder="例如 83725"></div>
      <div class="field"><label>密保答案</label><input id="fgtA" placeholder="回答密保问题"></div>
      <div class="field"><label>新密码</label><input id="fgtPwd" type="password" placeholder="设置新密码，至少 6 位"></div>
      <button class="btn" onclick="doResetPwd()">重置密码</button>
      <div class="auth-switch"><button onclick="showAuth('login')">← 返回登录</button></div>
      <div class="auth-msg" id="fgtMsg"></div>
    </div>
  </div>

async function sha256(text){

/* ===== 网络重试 + 本地缓存（国内访问国外服务器不稳的兜底） ===== */
async function sbRetry(fn, tries){
  tries = tries || 3;
  let lastErr;
  for(let i=0;i<tries;i++){
    try{ return await fn(); }
    catch(e){ lastErr = e; if(i<tries-1) await new Promise(r=>setTimeout(r, 500*(i+1))); }
  }
  throw lastErr;
}
function cacheSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify({ t: Date.now(), v: val })); }catch(e){}
}
function cacheGet(key){
  try{ const j = JSON.parse(localStorage.getItem(key)||"null"); return (j && j.v !== undefined) ? j.v : null; }catch(e){ return null; }
}
function todayCacheKey(){ return "ck_td_" + me.id + "_" + todayStr(); }
function clearTodayCache(){ try{ localStorage.removeItem(todayCacheKey()); }catch(e){} }

  try{
    const c = cacheGet("ck_p_"+me.id);

    const w = cacheGet("ck_w_"+me.id);

  }catch(e){}

  try{
    const cachedChat = cacheGet("ck_chat_"+me.id);
    if(!(Array.isArray(cachedChat) && cachedChat.length)){
      const cb=$("chatBox");
      if(cb) cb.innerHTML = `<div class="msg ai"><span class="who">搭搭</span>正在同步你的数据…</div>`;
    }
  }catch(e){}
  // 后台静默刷新：项目与课表并行拉取（互不依赖），失败自动重试，成功后更新缓存并播开场白
  (async()=>{

    try{ await bootChat(); }catch(e){ console.error("boot fail", e); }

/* ===== 统一打卡数据层：整个 App 只拉一次打卡记录（当天有效），
   今日计数/昨日查询/欠账/AI回忆/日历/统计全部复用内存，不再各自发查询。
   打卡、撤回、补卡后增量更新，不重查。网络失败各调用方自行容错，不阻断主流程 ===== */
let checkinsCache = null;   // { rows:[{id,date,project_id,meta,created_at}], day:缓存日期 }

async function getMyCheckins(force){

  const r = await sbRetry(()=>sb.from("checkins").select("id, date, project_id, meta, created_at").eq("user_id", me.id).order("date",{ascending:false}).limit(2000), 3);
  if(r.error) throw r.error;
  checkinsCache = { rows: r.data||[], day: t };
  return checkinsCache.rows;
}
async function getMyCheckinsSafe(force){

}

async function loadProjects(force){
  // 项目列表 与 打卡记录 并行拉取（都只依赖 user.id）
  const [res, todayRows] = await Promise.all([
    sbRetry(()=>sb.from("projects").select("*").order("sort"), 3),
    getMyCheckinsSafe(force)
  ]);
  if(res.error) throw res.error; // 查询失败要显式报错，不能静默当"没数据"
  myProjects = res.data||[];
  const t = todayStr();
  if(todayRows){
    // 今日次数：从统一数据层数一遍（0 额外查询）
    const m = {};
    for(const r of todayRows) if(r.date===t && r.project_id) m[r.project_id]=(m[r.project_id]||0)+1;
    for(const p of myProjects) p.today = m[p.id]||0;
  } else {
    // 打卡记录没拉到：读本地备份计数，绝不显示假 0
    try{
      const cm = {}; (cacheGet(todayCacheKey())||[]).forEach(x=>cm[x.id]=x.today);
      myProjects.forEach(p=>{ if(cm[p.id]!==undefined) p.today = cm[p.id]; });
    }catch(e){}
  }
  cacheSet("ck_p_"+me.id, myProjects);
  cacheSet(todayCacheKey(), myProjects.map(p=>({ id:p.id, today:p.today })));
}

function nextBadge(streak, total){
  for(const b of BADGES){
    if(!b.isTotal && streak < b.d) return b;
    if(b.isTotal && total < b.d) return b;
  }
  return null;
}
function diffDays(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
async function calcBadgeStats(){
  const data = await getMyCheckins();   // 复用打卡数据层，零额外查询；失败显式报错，避免误显示"徽章全没解锁"
  const dateList = data.map(d=>d.date).filter(Boolean);
  const dates = new Set(dateList);
  let streak=0; const d=new Date();
  while(dates.has(todayStr(d))){ streak++; d.setDate(d.getDate()-1); }
  const sorted=[...dates].sort();
  const unlock={};
  let curStreak=0, curTotal=0, prev=null;
  for(const ds of sorted){
    curTotal++;
    curStreak = (prev && diffDays(prev, ds)===1) ? curStreak+1 : 1;
    prev = ds;
    for(const b of BADGES){
      if(unlock[b.d]) continue;
      if(b.isTotal ? curTotal>=b.d : curStreak>=b.d) unlock[b.d]=ds;
    }
  }
  return { streak, total: dates.size, unlock };
}

function renderQuick(chips){
  const box=$("quickInputs");
  box.innerHTML = "";
  for(const c of chips){
    const b=document.createElement("span");
    b.className="qchip"; b.textContent=c;
    b.onclick = ()=>{ chatReply(c); };
    box.appendChild(b);
  }
}
function clearQuick(){ $("quickInputs").innerHTML=""; }

async function chatReply(text){
  if(!convState){ addMsg(text,"me"); aiChat(text); return; }
  addMsg(text, "me");
  clearQuick();
  try{
    await convState.next(text);
  }catch(err){
    convState = null;
    renderQuick(["打卡","聊天"]);
    addMsg("打卡这边好像卡了一下，没关系，咱们接着来：想打卡还是聊天？😉","ai");
  }
}

/* ================= 打卡逻辑 ================= */
function openProjectPanel(){
  if(!myProjects.length){
    openPlanPanel();
    return;
  }
  $("projGrid").innerHTML = myProjects.map(p=>{
    return `<div class="proj-card" onclick="startCheckin('${p.id}')">
      <div class="em">${p.emoji||"✅"}</div>
      <div class="nm">${p.name}</div>
      <div class="cnt">今日已打卡 ${p.today||0} 次${(p.today||0)>0?` <button class="undo" onclick="event.stopPropagation();undoCheckinToday('${p.id}')">撤回</button>`:""}</div>
    </div>`;
  }).join("");
  $("projPanel").classList.remove("hidden");
}
function closePanel(){ $("projPanel").classList.add("hidden"); }
async function closePlanPanel(){
  if(editProj && planDirty()){
    if(confirm("有改动还没保存：\n「确定」= 保存后再关闭\n「取消」= 不保存直接关闭")){
      const ok = await planSaveProject();
      if(!ok) return;   // 保存失败，不关闭面板
    } else {
      planExitEditNow();
    }
  }
  $("planPanel").classList.add("hidden");
  $("planToast").classList.add("hidden");
}

/* ================= 项目管理 + 周计划 ================= */
let plansByProj = {};    // {projectId:{dow:{title, actions:[{id,name,sets,reps}]}}}
let editProj = null;     // 正在编辑的项目 {id, name, week:{dow:{title,actions}}}
let planEditDow = null;  // 正在编辑的星期几

async function loadAllPlans(){
  plansByProj = {};
  try{
    const [wpRes, actRes] = await Promise.all([
      sbRetry(()=>sb.from("weekly_plan").select("*").eq("user_id", me.id), 3),
      sbRetry(()=>sb.from("plan_actions").select("*").eq("user_id", me.id).order("sort"), 3)
    ]);
    if(wpRes.error) throw wpRes.error;
    if(actRes.error) throw actRes.error;
    for(const r of (wpRes.data||[])){
      (plansByProj[r.project_id] = plansByProj[r.project_id] || {})[r.dow] = { title: r.title||"", actions: [] };
    }
    for(const a of (actRes.data||[])){
      const wk = plansByProj[a.project_id] || (plansByProj[a.project_id] = {});
      (wk[a.dow] = wk[a.dow] || { title:"", actions:[] }).actions.push(a);
    }
    cacheSet("ck_w_"+me.id, plansByProj);
  }catch(e){ /* 读不到就用默认课表兜底 */ }
}

async function openPlanPanel(){
  $("planPanel").classList.remove("hidden");
  planExitEditNow();
}

function renderPlanProjList(){
  const box = $("planProjList");
  box.innerHTML = "";
  if(!myProjects.length){
    box.innerHTML = '<div style="font-size:13px;color:var(--sub)">还没有项目，点下面添加一个</div>';
    return;
  }
  for(const p of myProjects){
    const row = document.createElement("div");
    row.className = "plan-proj-row";
    const nm = document.createElement("div");
    nm.className = "nm";
    const wk = plansByProj[p.id] || {};
    const setDays = Object.keys(wk).filter(d=>wk[d] && wk[d].title).length;

/* 动作排序：桌面拖拽 + 手机长按拖动 */
function bindRowDrag(box, actions){
  let dragIdx = -1;
  box.querySelectorAll(".act-row").forEach(row=>{
    row.addEventListener("dragstart", e=>{
      dragIdx = parseInt(row.dataset.idx,10);
      row.style.opacity = ".45";
      try{ e.dataTransfer.setData("text/plain","x"); e.dataTransfer.effectAllowed="move"; }catch(err){}
    });
    row.addEventListener("dragend", ()=>{ row.style.opacity=""; dragIdx=-1; });
    row.addEventListener("dragover", e=>e.preventDefault());
    row.addEventListener("drop", e=>{
      e.preventDefault();
      const to = parseInt(row.dataset.idx,10);
      if(dragIdx>=0 && dragIdx!==to){
        const it = actions.splice(dragIdx,1)[0];
        actions.splice(to,0,it);
        renderDayActions(actions);
      }
    });
  });
  let tid=-1, from=-1, lastY=0, accY=0;
  box.addEventListener("touchstart", e=>{
    const t = e.target.closest ? e.target.closest(".act-row") : null;
    if(!t) return;
    clearTimeout(tid);
    tid = setTimeout(()=>{
      from = parseInt(t.dataset.idx,10);
      lastY = e.touches[0].clientY; accY = 0;
      t.classList.add("dragging");
    }, 200);
  }, {passive:true});
  box.addEventListener("touchmove", e=>{
    if(from<0) return;
    e.preventDefault();
    const y = e.touches[0].clientY;
    accY += y - lastY; lastY = y;
    const rows = Array.from(box.querySelectorAll(".act-row"));
    const cur = rows.findIndex(r=>parseInt(r.dataset.idx,10)===from);
    if(cur<0){ from=-1; return; }
    const it = actions[cur];
    const target = accY>0 ? rows[cur+1] : rows[cur-1];
    if(target){
      const tr = target.getBoundingClientRect();
      if((accY>0 && y>tr.top+tr.height/2) || (accY<0 && y<tr.top+tr.height/2)){
        actions.splice(cur,1);
        actions.splice(accY>0 ? cur : cur-1, 0, it);
        accY = 0;
        renderDayActions(actions);
        from = actions.indexOf(it); // 跟随该动作继续拖
      }
    }
  }, {passive:false});
  box.addEventListener("touchend", ()=>{
    clearTimeout(tid);
    if(from>=0){ from=-1; box.querySelectorAll(".act-row").forEach(r=>r.classList.remove("dragging")); }
  });
}

async function planSaveProject(){

      if(error){

        throw error;
      }
      pid = data[0].id;
    }
    // 清掉该项目旧课表（两张表并行删），然后批量写入（各一次请求）
    const wps = [], acts = [];
    for(const dow in editProj.week){
      const item = editProj.week[dow];
      if(!item || !item.title) continue;
      const d = parseInt(dow,10);
      wps.push({ user_id: me.id, project_id: pid, dow: d, title: item.title });
      (item.actions||[]).forEach((a,i)=>{
        acts.push({ user_id: me.id, project_id: pid, dow: d, name: a.name, sets: a.sets||null, reps: a.reps||null, sort: i });
      });
    }
    // 先插入新课表、成功后再删旧课表：万一中途失败，旧数据还在，不会丢
    const jobs = [];
    if(wps.length) jobs.push(sb.from("weekly_plan").insert(wps));
    if(acts.length) jobs.push(sb.from("plan_actions").insert(acts));
    if(jobs.length) await Promise.all(jobs);
    await Promise.all([
      sb.from("weekly_plan").delete().eq("user_id", me.id).eq("project_id", pid),
      sb.from("plan_actions").delete().eq("user_id", me.id).eq("project_id", pid)
    ]);
    // 并行刷新本地缓存
    await Promise.all([loadProjects(), loadAllPlans()]);
    const days = wps.length;
    planExitEditNow();
    showPlanToast("✅ 已保存「"+name+"」" + (days ? "，课表 "+days+" 天" : ""));
    return true;
  }catch(err){
    console.error("save project fail:", err);
    msgEl.textContent = "保存失败：" + (err.message||"") + "，稍后再试";
    return false;
  }
}

/* 搭搭智能识别：一段自然语言 -> 当前项目的周计划/动作明细 */
/* 第一步走本地规则解析（对"周一 + 动作列表"这种规整文本 100% 可靠），失败再让 AI 兜底 */
function planParseLocal(text){
  const dowMap = {日:0, 一:1, 二:2, 三:3, 四:4, 五:5, 六:6};
  const segs = [];
  const parts = text.split(/(周[一二三四五六日])/);
  let cur = null;
  for(const part of parts){
    const t = (part||"").trim();
    if(!t) continue;
    const dm = t.match(/^周([一二三四五六日])$/);
    if(dm){ cur = { dow: dowMap[dm[1]], title:"", actions:[], lines:[] }; segs.push(cur); continue; }
    if(cur) for(const ln of t.split(/\n/)) cur.lines.push(ln);
  }
  if(!segs.length) return null;
  for(const s of segs){
    // 标题①：第一行是"推日：动作…"这种格式
    const tRe = (s.lines[0]||"").match(/^([^0-9:：、]{1,8})[:：]/);
    if(tRe) s.title = tRe[1].trim();
    // 标题②：第一个不以"动作"开头、不含数字和"组"字、且短的行
    if(!s.title){
      for(const ln of s.lines){
        if(ln.length<=12 && !/动作|[0-9]|组|×|x|X/.test(ln)){
          s.title = ln.replace(/[:：、]+$/,"").trim();
          break;
        }
      }
    }
    // 动作行解析（支持 动作1： / 顿号分隔 / 直接"名称3组×15个" / "名称3组15个"）
    for(const ln of s.lines){
      if(ln === s.title) continue;
      let line = ln;
      if(s.title && line.indexOf(s.title)===0 && (line[s.title.length]===":" || line[s.title.length]==="：")) line = line.slice(s.title.length+1);
      const chunks = line.split(/[、，,;；]/);
      for(let c of chunks){
        c = c.replace(/^动作\s*\d*\s*[:：.．、]\s*/, "").trim();
        c = c.replace(/^周[一二三四五六日][^0-9]{0,8}?[:：]\s*/, "").trim();
        if(!c) continue;
        const am = c.match(/(.+?)(\d+)\s*组\s*[×xX*]?\s*(\d+)\s*(个|次)?\s*(\/侧|每侧)?/);
        if(am){
          s.actions.push({
            name: am[1].replace(/每侧$/,"").trim(),
            sets: parseInt(am[2],10),
            reps: (am[3]||"") + (am[4]||"") + (am[5]||"")
          });
        }
      }
    }
    if(!s.title && s.actions.length) s.title = "训练日";
    if(!s.title) s.title = "未设置";
  }
  return segs.filter(s=>s.dow>=0 && s.dow<=6);
}
/* AI 返回 JSON 的容错解析 */
function tryJsonParse(raw){
  const m = raw.match(/\{[\s\S]*\}/);
  if(!m) return null;
  let s = m[0]
    .replace(/```(json)?/gi,"")
    .replace(/，/g,",").replace(/：/g,":")
    .replace(/“|”|「|」/g,'"')
    .replace(/,\s*}/g,"}").replace(/,\s*]/g,"]");
  try{ return JSON.parse(s); }catch(e){}
  s = s.replace(/\/\/[^\n]*/g,"").replace(/'/g,'"');
  try{ return JSON.parse(s); }catch(e){ return null; }
}
const AI_PARSE_SYSTEM = "你是打卡计划解析器。用户会输入一段中文的训练/学习计划文字，你要把它提取成结构化的 JSON。只输出一个 JSON 对象，不要输出任何其他文字、解释或 markdown 代码块。JSON 格式：{\"plan\":[{\"dow\":1,\"title\":\"推日\",\"actions\":[{\"name\":\"仰卧起坐\",\"sets\":3,\"reps\":\"15\"},{\"name\":\"俯卧撑\",\"sets\":4,\"reps\":\"12\"}]}]}。规则：dow 是星期几，0=周日、1=周一、2=周二、3=周三、4=周四、5=周五、6=周六，只能填 0-6；title 是当天计划名称（如 推日/拉日/腿日/间歇跑/休息/学习），没写就填\"训练日\"；actions 是动作数组，name=动作名，sets=组数（没写组数填 null），reps=次数文字（如\"15\"、\"每侧15个\"、\"10分钟\"，没写填 null）；用户说某天\"休息/不练/休息日\"时，该天 actions 给空数组 [ ]，title 填\"休息\"；没有提到的日期不要出现在 plan 里；如果完全没有识别到任何日期，输出 {\"plan\":[]}。请特别注意：输入可能是\"周一\\n动作1：上斜跪姿俯卧撑3组×15个\\n动作2：…\"这种逐行动作列表，要逐行解析到 actions 里。";
function applyPlanToEdit(planArr){
  for(const item of planArr){
    editProj.week[item.dow] = {
      title: (item.title||"").trim() || "训练日",
      actions: (item.actions||[]).filter(a=>a && a.name).map(a=>({ name:a.name, sets:a.sets||null, reps:a.reps||null }))
    };
  }
}
async function aiParsePlan(){
  const text = $("planAiText").value.trim();
  const msgEl = $("planAiMsg");
  if(!text){ msgEl.textContent="先输入你的计划文字（比如：周一推日，仰卧起坐3组15个）"; return; }
  if(!editProj){ msgEl.textContent="先进入一个项目的编辑页，再让搭搭识别"; return; }
  msgEl.classList.remove("ok");
  // 第一步：本地规则解析（最快最稳）
  const local = planParseLocal(text);
  if(local && local.length){
    applyPlanToEdit(local);
    planBackToWeek();
    msgEl.classList.add("ok");
    const n = local.reduce((s,x)=>s+x.actions.length,0);
    msgEl.textContent = "✅ 已识别 " + local.length + " 天、" + n + " 个动作，记得点下面「💾 保存」才生效";
    return;
  }
  // 第二步：AI 兜底
  msgEl.textContent = "搭搭正在识别…";
  try{
    const { data, error } = await sb.functions.invoke("chat-ai", {
      body: { messages:[{ role:"user", content:text }], system: AI_PARSE_SYSTEM }
    });
    if(error) throw new Error(error.message || "调用失败");
    const json = tryJsonParse((data && data.reply) || "");
    if(!json) throw new Error("AI 没返回可识别的格式");
    const planArr = (json.plan||[]).filter(x=>Number.isInteger(x.dow) && x.dow>=0 && x.dow<=6);
    if(!planArr.length) throw new Error("没有识别到具体日期");
    applyPlanToEdit(planArr);
    planBackToWeek();
    msgEl.classList.add("ok");
    msgEl.textContent = "✅ 搭搭识别出 " + planArr.length + " 天的安排，记得点下面「💾 保存」才生效";

async function delProject(pid){
  const p = myProjects.find(x=>x.id===pid);
  if(!p) return;
  if(!confirm("删除「"+p.name+"」？\n它的全部打卡记录也会一起删掉，无法恢复。")) return;

function startCheckin(pid){
  closePanel();
  const p = myProjects.find(x=>x.id===pid);
  if(!p) return;
  if(p.name==="锻炼"){

let timerInt=null, timerStartAt=0, timerMode=null, timerProject=null, timerMeta={};
function startTimer(mode){
  timerMode = mode;
  timerProject = convState ? convState.project : null;
  timerMeta = convState ? Object.assign({}, convState.data) : {};
  timerStartAt = Date.now();
  $("timerHint").textContent = mode==="锻炼" ? "动起来！练完点下方「停止计时」" : "学起来！结束点下方「停止计时」";
  $("timerPanel").classList.remove("hidden");
  renderTimer();
  clearInterval(timerInt);
  timerInt = setInterval(renderTimer, 500);
}
function renderTimer(){
  const s = Math.floor((Date.now()-timerStartAt)/1000);
  const h = String(Math.floor(s/3600)).padStart(2,"0");
  const m = String(Math.floor(s%3600/60)).padStart(2,"0");
  const ss = String(s%60).padStart(2,"0");
  $("timerDisplay").textContent = h+":"+m+":"+ss;
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
async function stopTimer(){
  clearInterval(timerInt);
  const sec = Math.floor((Date.now()-timerStartAt)/1000);
  const minutes = sec<60 ? 1 : Math.round(sec/60);
  $("timerPanel").classList.add("hidden");
  const p = timerProject;
  const meta = Object.assign({}, timerMeta, { duration_min: minutes });
  convState = null;
  if(!p) return;
  await doCheckinRecord(p, meta);
  const streak = await calcStreak(p.id);
  const total = await calcTotal(p.id);
  if(timerMode==="锻炼"){
    const plan = todayPlan();
    let praise;
    if(plan && meta.type===plan.name) praise = `按计划练的${meta.type}，${minutes}分钟，一点不含糊👊`;
    else praise = `练了${meta.type} ${minutes}分钟，这劲头可以🔥`;
    addCard(buildCheckinCard({kind:"锻炼", proj:meta.type||"", min:minutes, extra:meta.type||"", streak, total, praise}));
    const w2 = pick([
      "计时到！今天的锻炼记上了，牛逼！🔥",
      "到点收工！"+praise+" 已经给你记上了💪",
      "叮！锻炼打卡完成，"+praise+"💪",
      "计时结束，锻炼已记录。这波肌肉记忆又加深了一层⚡",
      "收工！锻炼打卡成功——"+praise+"✨",
      "时间到！锻炼记上了，今天也对自己够狠👍"
    ]);
    addMsg(w2,"ai");
    saveChat("assistant", "CARD|锻炼|"+(meta.type||"")+"|"+minutes+"|"+streak+"|"+total+"|"+w2);
  } else {
    const w3 = pick([
      "计时到！"+minutes+"分钟的学习稳稳拿下，专注力+1📈",
      "叮！"+minutes+"分钟学习打卡成功，知识+1、疲惫-1😎",
      minutes+"分钟到点！学习已记上，脑子又装了一格📚",
      "计时结束，"+minutes+"分钟专注达成，今天的自己又进一步✨",
      "学习"+minutes+"分钟拿下！坚持打卡的人运气不会太差🍀"
    ]);
    addCard(buildCheckinCard({kind:"学习", proj:meta.subject||"", min:minutes, extra:meta.subject||"", streak, total, praise:w3}));
    addMsg(w3,"ai");
    saveChat("assistant", "CARD|学习|"+(meta.subject||"")+"|"+minutes+"|"+streak+"|"+total+"|"+w3);
  }
  renderDailyTips();
}
function cancelTimer(){
  clearInterval(timerInt);

async function doCheckinRecord(project, meta){
  await sb.from("checkins").insert({
    user_id: me.id, project_id: project.id, date: todayStr(), note:"", meta
  });
  project.today = (project.today||0)+1;
  addCheckinsCacheRow(project.id, todayStr(), meta);  // 增量更新打卡数据层，后续功能不用重查
  clearTodayCache(); // 今日计数变了，失效当天缓存
  // 打卡同步写入「打卡记录」页，刷新后依然可见
  const mm = meta||{};
  const extra = mm.duration_min ? mm.duration_min+"分钟" : (mm.subject ? mm.subject : (mm.type ? mm.type : ""));
  saveRecord("打卡", project.name, "完成", extra || "无");
  saveChat("user", "打卡："+project.name + (extra ? "（"+extra+"）" : ""));
}
/* 撤回今天该项目的最近一次打卡（打错/想重新打卡时用） */
async function undoCheckinToday(pid){
  const p = myProjects.find(x=>x.id===pid);
  if(!p) return;
  if(!confirm("撤回「"+p.name+"」今天最近的一次打卡？")) return;
  const t = todayStr();
  try{
    const { data } = await sb.from("checkins")
      .select("id")
      .eq("user_id", me.id).eq("project_id", pid).eq("date", t)
      .order("created_at", { ascending:false })
      .limit(1);
    if(!data || !data.length){ alert("今天没有可撤回的打卡记录"); return; }
    await sb.from("checkins").delete().eq("id", data[0].id);
    // 同步从打卡数据层移除（按 id），今日计数即时更新
    if(checkinsCache) checkinsCache.rows = checkinsCache.rows.filter(r=>r.id!==data[0].id);
  }catch(e){
    alert("撤回失败，稍后再试");
    return;
  }
  clearTodayCache(); // 今日计数变了，失效当天缓存
  await loadProjects();
  openProjectPanel();
  const box=$("chatBox");
  if(box && document.querySelector("#mainView:not(.hidden)")){
    addMsg("已撤回「"+p.name+"」今天最近一次打卡，重新打卡的话点卡片就行~","ai");
  }
}

async function calcStreak(pid){
  try{
    const r = await sbRetry(()=>sb.from("checkins").select("date").eq("project_id", pid).order("date", { ascending:false }).limit(60), 3);
    if(r.error) throw r.error;
    const data = r.data||[];
    if(!data.length) return 0;
    const dates = new Set(data.map(d=>d.date));
    let n=0; const d=new Date();
    while(dates.has(todayStr(d))){ n++; d.setDate(d.getDate()-1); }
    return n;
  }catch(e){ console.warn("streak calc fail", e); return 0; }  // 计算失败不打断打卡流程，卡片数字刷新后为准
}
async function calcTotal(pid){
  try{
    const r = await sbRetry(()=>sb.from("checkins").select("id", { count:"exact", head:true }).eq("project_id", pid), 3);
    if(r.error) throw r.error;
    return r.count||0;
  }catch(e){ console.warn("total calc fail", e); return 0; }
}

function pickSticker(text){
  const t=String(text||"");
  if(/打卡成功|打卡完成|任务完成|记上了|拿下了|完成打卡|今天的锻炼|稳稳拿下/.test(t)) return STICKERS.success;
  if(/没打卡|别偷懒|偷懒|欠债|欠了|该打卡了/.test(t)) return STICKERS.lazy;
  if(/加油|坚持|努力|顶住|别放弃|自律|拿捏/.test(t)) return STICKERS.cheer;
  if(/你好|在呢|欢迎|回来|认识一下|嗨/.test(t)) return STICKERS.hi;
  if(/真棒|厉害|优秀|太强|了不起|牛逼/.test(t)) return STICKERS.praise;
  return "";
}
function attachSticker(text){
  const s=pickSticker(text);
  return s ? text + `<img class="sticker" src="${s}" alt="搭搭表情">` : text;
}
async function sendChat(){
  const inp=$("chatInput");
  const t=inp.value.trim();
  if(!t) return;
  inp.value="";
  // 如果正停在历史某天的对话视图，先跳回最新对话，避免新消息混进历史那天
  if(viewingHistoryDate){
    viewingHistoryDate = null;
    try{ await backToLatest(); }catch(e){}
  }
  if(convState){
    chatReply(t).catch(()=>{ convState=null; addMsg("咦，刚才卡了一下。咱们重新聊——今天打卡了吗？😉","ai"); });
    return;
  }
  addMsg(t,"me");
  saveChat("user", t);
  saveAiNote(t);
  if(window._missAsk){
    const q = window._missAsk;
    window._missAsk = null;
    const r = classifyMiss(t);
    saveRecord("漏卡", q.names.join("、")+"（"+q.date+"）", r.status, t);
    addMsg(pick([
      `收到！原因记下了：${r.status}。月底我帮你复盘，看看到底是谁在挡路😉`,
      `嗯，${r.status}——了解了，先记下。次数多了我会提醒你，别让同一种原因反复出现哦`,
      `好，${r.status}。记上了！下个月咱们想办法避开它💪`,
    ])(),"ai");
    return;
  }
  // 「记住：…」口令：命令必记，前端直接存并确认（不走AI，确保一定记下）
  const rm = t.match(/^(记住|记一下|帮我记住|记着|别忘了)[：:\s,，]*(.+)$/);
  if(rm){
    const note = rm[2].trim().slice(0,80);
    if(note){
      const ok = await saveNoteDirect(note);
      addMsg(pick([
        `好，记下了：「${note}」～我记性很好的`,
        `记住了！「${note}」，我会一直想着的`,
        `嗯嗯，写进我的小本本：「${note}」`,
      ])(), "ai");
      if(!ok) console.error("remember save failed");
    }
    return;
  }
  aiChat(t);
}

let aiBusy = false;
let aiCtxCache = "";   // 每次对话前刷新：用户最近打卡记录摘要，喂给搭搭
async function getAiContext(){
  try{
    const from = new Date(); from.setDate(from.getDate()-6);
    const data = await getMyCheckins();   // 复用打卡数据层，零额外查询
    const list = (data||[]).filter(c=>c.date >= todayStr(from));
    if(!list.length) return "（最近7天暂无打卡记录）";
    const nameMap = {}; myProjects.forEach(p=>nameMap[p.id]=p.name);
    const byDate = {};
    for(const c of list){
      const nm = nameMap[c.project_id] || "未知项目";
      const mm = c.meta || {};
      let extra = "";
      if(mm.duration_min) extra = `（${mm.duration_min}分钟）`;
      else if(mm.subject) extra = `（${mm.subject}）`;
      else if(mm.type) extra = `（${mm.type}）`;
      (byDate[c.date] = byDate[c.date] || []).push(nm + extra);
    }
    return Object.keys(byDate).sort().reverse().slice(0,7)
      .map(d=>`${d}：${byDate[d].join("、")}`).join("\n");
  }catch(e){
    return "（暂时读不到打卡记录）";
  }
}
let aiMemCache = null;          // 每次对话前刷新：最近对话回忆 + 记住的事 + 今日状态
let aiStateCache = { todayNames:[], streak:0, total:0 };
let aiWeatherCache = null;      // 每次对话前刷新：烟台今日天气（免费API，失败静默）
async function getAiMemory(){
  try{
    // 一次拉最近 100 条对话（含备注），同时满足：最近回忆 / 记住的事 / 离开天数（原来是 3 次查询）
    const r0 = await sbRetry(()=>sb.from("chat_messages")
      .select("role,content,created_at").eq("user_id", me.id)
      .order("created_at",{ascending:false}).limit(100), 3);
    if(r0.error) throw r0.error;
    const msgsAll = r0.data||[];
    const msgs = msgsAll.slice().reverse();   // 恢复正序（旧→新），与历史逻辑一致
    const dayMap={};
    for(const m of msgs){
      if(m.role==="note") continue;
      const txt=(m.content||"").replace(/\[[记改动静补]:[^\]\n]*\]/g,"").trim().slice(0,60);
      if(!txt) continue;
      const d=String(m.created_at).slice(0,10);
      const key = d===todayStr() ? "今天" : (d.slice(5,7)+"月"+d.slice(8,10)+"日");
      (dayMap[key]=dayMap[key]||[]).push((m.role==="user"?"你说：":"搭搭说：")+txt);
    }
    const recentTxt = Object.keys(dayMap).slice(-5).map(d=>d+" "+dayMap[d].slice(-6).join("；")).join("\n");
    const notes = msgs.filter(m=>m.role==="note").slice(-10).map(n=>n.content);
    // 打卡状态：复用打卡数据层（原来是 2 次查询）
    let todayNames=[], streak=0, total=0;
    try{
      const rows = await getMyCheckins();
      const nm={}; myProjects.forEach(p=>nm[p.id]=p.name);
      for(const c of rows) if(c.date===todayStr()) todayNames.push(nm[c.project_id]||"未知");
      const dates=new Set(rows.map(d=>d.date));
      total=dates.size;
      const dd=new Date();
      while(dates.has(todayStr(dd))){ streak++; dd.setDate(dd.getDate()-1); }
    }catch(e){}
    let goneDays = 0;
    const last = msgs.filter(m=>m.role!=="note").slice(-1)[0];
    if(last){
      const ld = new Date(last.created_at);
      const todayS = new Date(); todayS.setHours(0,0,0,0);
      const lastS = new Date(ld.getFullYear(), ld.getMonth(), ld.getDate());
      goneDays = Math.max(0, Math.round((todayS - lastS)/86400000));
    }
    aiStateCache = { todayNames, streak, total };
    return {
      recent: recentTxt || "（最近几天没有聊过天）",
      notes: notes.join("\n") || "（还没有特别记下的事）",
      goneDays
    };
  }catch(e){
    return { recent:"（读不到）", notes:"（读不到）", goneDays:0 };
  }
}
async function getAiWeather(){
  // 5 分钟缓存：连续聊天不反复请求外部天气接口
  if(weatherCache && Date.now()-weatherCache.t < 300000) return weatherCache.txt;
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 4000);
    const r = await fetch("https://wttr.in/Yantai?format=j1", { signal: ctrl.signal });
    clearTimeout(timer);
    const j = await r.json();
    const c = j && j.current_condition && j.current_condition[0];
    if(!c) return null;
    const desc = (c.weatherDesc && c.weatherDesc[0] && c.weatherDesc[0].value) || "";
    const txt = "烟台今天" + (desc?desc+"，":"") + c.temp_C + "℃，体感" + c.FeelsLikeC + "℃";
    weatherCache = { txt, t: Date.now() };
    return txt;
  }catch(e){ return null; }
}
async function saveNoteDirect(note){
  if(!me||!sb||!note) return false;
  try{
    const { data: dup } = await sb.from("chat_messages").select("id").eq("user_id", me.id).eq("role","note").eq("content",note).limit(1);
    if(dup && dup.length) return true;
    await sb.from("chat_messages").insert({ user_id: me.id, role:"note", content:note });
    return true;
  }catch(e){ return false; }
}
async function saveAiNote(t){
  if(!me||!sb) return;
  if(/^(记住|记一下|帮我记住|记着|别忘了)[：:\s,，]/.test(t)) return;
  if(!/(我的目标|目标是想|想练|想减|想增|想瘦|想胖|受伤|拉伤|扭到|膝盖|腰不|肩不|不舒服|考试|换工作|职业|报名|坚持了|戒了|打算)/.test(t)) return;
  saveNoteDirect(t.slice(0,80));
}
async function aiChat(t){
  if(aiBusy){ addMsg("稍等，我先把上一句回完~","ai"); return; }
  aiBusy = true;
  const loading = addMsg("搭搭正在输入…","ai");
  loading.id = "typingMsg";
  loading.style.opacity = ".75";
  try{
    aiCtxCache = await getAiContext();
    aiMemCache = await getAiMemory();
    aiWeatherCache = await getAiWeather();
    const hist = chatHistory(t);
    const { data, error } = await sb.functions.invoke("chat-ai", {
      body: { messages: hist, system: aiSystem() }
    });
    if(error) throw new Error(error.message || "调用失败");
    if(!data || data.error) throw new Error((data && data.error) || "无回复");
    const rawReply = data.reply || "";
    // 标记容错：AI 偶尔用全角冒号/竖线，先归一化再解析，避免"假装答应但标记没被识别"
    const reply = rawReply.replace(/：/g,":").replace(/｜/g,"|");
    const recRe = /\[记:([^|\]]+)\|([^|\]]+)\|([^|\]]+)\|([^\]]*)\]/g;
    const rmAll = [...reply.matchAll(recRe)];
    const planRe = /\[改:([^|\]]+)\|([^|\]]+)\|([^|\]]+)\|([^\]]*)\]/g;
    const pmAll = [...reply.matchAll(planRe)];
    const actRe = /\[动:([^|\]]+)\|([^|\]]+)\|([^|\]]+)\|([^|\]]*)\|([^|\]]*)\|([^\]]*)\]/g;
    const amAll = [...reply.matchAll(actRe)];
    const moveRe = /\[移:([^|\]]+)\|([^|\]]+)\|([^|\]]+)\]/g;
    const mvAll = [...reply.matchAll(moveRe)];
    const bfRe = /\[补:([^|\]]+)\|([^|\]]+)\|([^\]]*)\]/g;
    const bfAll = [...reply.matchAll(bfRe)];
    let clean = reply.replace(/\[[记改动静补]:[^\]\n]*\]/g, "").trim();
    // 声称"改好/补好/移好"却没有任何标记 → 大概率假装答应，提醒用户
    if(/改好|补好|移好|记好|调整好|设置好|已经改|已改好|已补|已移|已记|帮你改|帮你调|给你改/.test(clean)
        && !(rmAll.length+pmAll.length+amAll.length+mvAll.length+bfAll.length)){
      addMsg("等一下，我好像光说改好了、没真正动手。先别刷新，你再跟我说一遍要改什么（比如：周一推日，俯卧撑3组×15个），我这次一定给你落实～","ai");
    }
    const lb = loading.querySelector(".msg");
    if(lb) lb.innerHTML = `<span class="who">搭搭</span>` + attachSticker(esc(clean));
    for(const m of rmAll){ await saveRecord(m[1].trim(), m[2].trim(), m[3].trim(), m[4].trim()); }
    for(const m of pmAll){ await applyAiPlanChange(m[1].trim(), m[2].trim(), m[3].trim(), m[4].trim()); }
    for(const m of amAll){ await applyAiActionChange(m[1].trim(), m[2].trim(), m[3].trim(), m[4].trim(), m[5].trim(), m[6].trim()); }
    for(const m of mvAll){ await applyAiMove(m[1].trim(), m[2].trim(), m[3].trim()); }
    for(const m of bfAll){ await applyAiBackfill(m[1].trim(), m[2].trim(), m[3].trim()); }
    saveChat("assistant", clean);
  }catch(err){
    console.error("ai chat fallback:", err);
    const lb2 = loading.querySelector(".msg");
    if(lb2) lb2.innerHTML = `<span class="who">搭搭</span>` + attachSticker(localReply(t));
    saveChat("assistant", localReply(t));
  }
  loading.style.opacity = "1";
  aiBusy = false;
}
function chatHistory(cur){
  const out=[];
  const nodes = document.querySelectorAll("#chatBox .msg");
  const arr = Array.from(nodes).slice(-10);
  for(const el of arr){
    if(el.id === "typingMsg") continue;
    const who = el.classList.contains("me") ? "user" : "assistant";
    let txt = (el.innerText||"").replace(/^搭搭/,"").trim();
    if(txt) out.push({ role: who, content: txt });
  }
  out.push({ role: "user", content: cur });
  return out;
}
function planSummaryForAI(){
  const lines = [];
  for(const p of myProjects){
    const wk = plansByProj[p.id];
    if(!wk) continue;
    const setDays = Object.keys(wk).filter(d=>wk[d] && wk[d].title);
    if(!setDays.length) continue;
    const parts = setDays.map(d=>{
      const item = wk[d];
      const acts = (item.actions && item.actions.length) ? "（"+item.actions.map(a=>a.name+(a.sets?` ${a.sets}组×`:"")+(repsTxt(a.reps))).join("、")+"）" : "";
      return "周"+WEEK_CN[+d]+" "+item.title+acts;
    });
    lines.push(p.name+"："+parts.join("；"));
  }
  return lines.join("\n");
}

          "⑧ 用户说「总结一下」「汇报」「今天怎么样」「最近怎么样」「我打卡情况怎么样」这类话时，结合【状态感知】【最近7天真实打卡记录】和课表，像老朋友一样简短汇总：今天练/学了什么、连续多少天、明天该练什么，语气自然，不用输出任何标记。\n" +
          "回复要口语化、简短（两三句内）、像朋友聊天，多鼓励，少说教。可以适当调侃用户偷懒。";
  return s;
}
/* ===== 搭搭修改课表：解析 [改:项目名|周几|标题|动作] 并写库 ===== */
function parseDowRange(s){
  const map = {日:0,天:0,一:1,二:2,三:3,四:4,五:5,六:6};
  const out = [];
  const range = s.match(/周([一二三四五六日天])\s*(?:到|至|-|~|—|～)\s*周?([一二三四五六日天])/);
  if(range){
    const a = map[range[1]]===0?7:map[range[1]], b = map[range[2]]===0?7:map[range[2]];
    for(let i=Math.min(a,b); i<=Math.max(a,b); i++) out.push(i===7?0:i);
  } else {
    const numRange = s.match(/(\d+)\s*(?:到|至|-|~|～)\s*(\d+)/);
    if(numRange){
      const a = parseInt(numRange[1],10)===0?7:parseInt(numRange[1],10), b = parseInt(numRange[2],10)===0?7:parseInt(numRange[2],10);
      for(let i=Math.min(a,b); i<=Math.max(a,b); i++) out.push(i===7?0:i);
    }
  }
  const singles = s.match(/周([一二三四五六日天])/g) || [];
  for(const x of singles) out.push(map[x[1]]);
  if(!out.length){
    const nums = s.match(/\d+/g) || [];
    for(const n of nums){ const v = parseInt(n,10)%7; out.push(v); }
  }
  return [...new Set(out)];
}
function parseAiActions(str){
  if(!str || str==="无" || str==="") return [];
  const out=[];
  const chunks = str.split(/[、，,;；\n]/);
  for(let c of chunks){
    c = (c||"").replace(/^动作\s*\d*\s*[:：.．、]\s*/,"").trim();
    if(!c) continue;
    const am = c.match(/(.+?)(\d+)\s*组\s*[×xX*]?\s*(\d+)\s*(个|次)?\s*(\/侧|每侧)?/);
    if(am) out.push({ name: am[1].trim(), sets: parseInt(am[2],10), reps: (am[3]||"")+(am[4]||"")+(am[5]||"") });
  }
  return out;
}

async function applyAiActionChange(projName, dowStr, actName, setsStr, repsStr, op){
  const p = myProjects.find(x=>x.name===projName) || myProjects.find(x=>projName && (x.name.indexOf(projName)>=0 || projName.indexOf(x.name)>=0));

  if(!days.length){ addMsg("搭搭没听清要改哪一天，再跟我说一次？比如「周一，俯卧撑两组改成三组」。","ai"); return; }
  const opc = (op||"加").trim();
  const setsN = (setsStr && setsStr!=="无") ? (parseInt(setsStr,10)||null) : null;
  const repsT = (repsStr && repsStr!=="无" && repsStr!=="") ? repsStr : null;
  if(opc!=="改" && opc!=="删" && opc!=="加"){ addMsg("没听懂你要对动作做什么（改/加/删），再说一次？","ai"); return; }
  try{
    for(const d of days){
      const cur = plansByProj[p.id] && plansByProj[p.id][d];
      let title = (cur && cur.title) || "";
      let acts = (cur && cur.actions ? cur.actions.map(a=>({ name:a.name, sets:a.sets, reps:a.reps })) : []);
      if(opc==="删"){
        acts = acts.filter(a=>a.name!==actName);
        if(!acts.length && title==="训练日") title = "";
      } else if(opc==="改"){
        const t = acts.find(a=>a.name===actName);
        if(t){
          if(setsN!==null) t.sets = setsN;
          if(repsT) t.reps = repsT;
        } else {
          acts.push({ name: actName, sets: setsN, reps: repsT });
        }
      } else {
        const t = acts.find(a=>a.name===actName);
        if(t){
          if(setsN!==null) t.sets = setsN;
          if(repsT) t.reps = repsT;
        } else {
          acts.push({ name: actName, sets: setsN, reps: repsT });
        }
      }
      if(!title && acts.length) title = "训练日";
      // 写库：先插新、成功后再删该天旧行（中途失败旧数据还在）
      if(title){
        await sb.from("weekly_plan").insert({ user_id: me.id, project_id: p.id, dow: d, title });
        if(acts.length) await sb.from("plan_actions").insert(acts.map((a,i)=>({ user_id: me.id, project_id: p.id, dow: d, name: a.name, sets: a.sets||null, reps: a.reps||null, sort: i })));
      }
      await Promise.all([
        sb.from("weekly_plan").delete().eq("user_id", me.id).eq("project_id", p.id).eq("dow", d),
        sb.from("plan_actions").delete().eq("user_id", me.id).eq("project_id", p.id).eq("dow", d)
      ]);
      // 更新内存缓存
      plansByProj[p.id] = plansByProj[p.id] || {};
      if(title && acts.length) plansByProj[p.id][d] = { title, actions: acts };
      else if(title) plansByProj[p.id][d] = { title, actions: [] };
      else delete plansByProj[p.id][d];
    }
    const names = days.map(d=>{
      const it = plansByProj[p.id] && plansByProj[p.id][d];
      const a = it && it.actions ? it.actions.map(x=>x.name+(x.sets?` ${x.sets}组×`:"")+(x.reps?x.reps+"个":"")).join("、") : "";
      return "周"+WEEK_CN[d]+"（"+(it&&it.title?it.title:"训练日")+(a?"："+a:"")+"）";
    }).join("；");
    addMsg("改好啦，已保存！现在 " + names + " ✅","ai");
  }catch(err){
    console.error("ai action change fail:", err);
    addMsg("改的时候出了点岔子（"+(err.message||"网络问题")+"），你先在「项目」界面手动改一下？","ai");
  }
}

/* 欠账计算：基于用户自定义课表（weekly_plan）——凡本周已过且设有课表的日子，
   从那天起到今天该训练类型没打过卡（含补卡）就算欠；后移补课也算销账。
   注意：不能用旧固定课表 WEEK_KEYS 算，用户课表已经自定义（如周一推日周三拉日周五腿周日跑） */
async function computeDebts(){
  const proj = myProjects.find(p=>p.name==="锻炼");
  if(!proj) return [];
  const wp = plansByProj[proj.id] || {};
  const setDays = Object.keys(wp).filter(d=>wp[d] && wp[d].title).map(Number);
  if(!setDays.length) return [];
  let rows = [];
  try{ rows = await getMyCheckins(); }catch(e){ return []; }   // 复用打卡数据层，读不到就当作没有欠
  const list = rows;
  const debts=[];
  const now=new Date();
  const dow=(now.getDay()+6)%7; // 周一=0
  for(let i=0;i<dow;i++){ // 本周一 至 昨天
    const dd=new Date(); dd.setDate(now.getDate()-(dow-i));
    const key = dd.getDay();
    const wpd = wp[key];
    if(!wpd || !wpd.title) continue;   // 那天没设课表 → 不欠
    const name = wpd.title;
    const ds=todayStr(dd);
    // 从该课表日到今天，该项目是否打过对应类型的卡（后移补课、补卡都算销账）
    const paid = list.some(r=> r.date>=ds && r.project_id===proj.id && r.meta &&
      (r.meta.type===name || r.meta.backfill));
    if(!paid) debts.push({ dow:dd.getDay(), name, ds });
  }
  return debts;
}

function uploadAvatar(input){
  const f = input.files && input.files[0];
  if(!f) return;
  if(f.size > 5*1024*1024){ alert("图片太大，选个 5MB 以内的吧"); input.value=""; return; }
  const rd = new FileReader();
  rd.onload = e=>{
    const img = new Image();
    img.onload = async ()=>{
      const size = 128;
      const c = document.createElement("canvas");
      c.width = size; c.height = size;
      const ctx = c.getContext("2d");
      const s = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      const data = c.toDataURL("image/jpeg", 0.85);
      try{
        const { error } = await sb.from("profiles").update({ avatar_b64: data }).eq("id", me.id);
        if(error) throw error;
        me.avatar_b64 = data;
        showMineHome();
      }catch(err){ alert("头像保存失败，稍后再试"); }
    };
    img.src = e.target.result;
  };
  rd.readAsDataURL(f);
}

let calYear = null, calMonth = null;

async function loadRecords(){
  const box=$("recordsView");
  if(!me){ box.innerHTML=""; return; }

  if(!myProjects.length) await loadProjects();
  const now = new Date();
  if(!calYear){ calYear = now.getFullYear(); calMonth = now.getMonth(); }
  const from = new Date(calYear, calMonth-1, 26);
  const to = new Date(calYear, calMonth+1, 5);
  let data = null;
  try{
    // 复用打卡数据层，按日历范围过滤（不再单独查库）
    const rows = await getMyCheckins();
    const fromS = todayStr(from), toS = todayStr(to);
    data = rows.filter(r=>r.date>=fromS && r.date<=toS);
  }catch(e){
    box.innerHTML = backBtn + `<div class="rec-empty">日历读取失败，自动重试过还是没连上，稍后再试试</div>`;
    return;
  }
  const nameMap = {}; myProjects.forEach(p=>nameMap[p.id]=p.name);
  const byDate = {};
  for(const r of (data||[])){ (byDate[r.date]=byDate[r.date]||[]).push(nameMap[r.project_id]||"项目"); }
  const today = todayStr();
  const firstDow = (new Date(calYear, calMonth, 1).getDay()+6)%7; // 周一开头
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  let cells = "";
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = calYear+"-"+String(calMonth+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const tags = byDate[ds]||[];
    const isToday = ds===today, isFuture = ds>today;
    const cls = ["cal-cell"];
    if(tags.length) cls.push("has"); else if(!isFuture) cls.push("miss");
    if(isToday) cls.push("today");
    if(isFuture) cls.push("future");
    let inner = `<div class="d">${d}${isToday?" ·":""}</div>`;
    const uniq = [...new Set(tags)].slice(0,2);
    inner += uniq.map((t,i)=>`<div class="cal-tag${i===1?" t-learn":""}">${esc(t)}</div>`).join("");
    if(!tags.length && !isFuture) inner += `<div class="addhint">补</div>`;
    const click = tags.length ? ` onclick="openDayDetail('${ds}')"` : (!isFuture ? ` onclick="openBackfillPanel('${ds}')"` : "");
    cells += `<div class="${cls.join(" ")}"${click}>${inner}</div>`;
  }
  box.innerHTML = backBtn + `
    <div class="cal-wrap">
      <div class="cal-head">
        <b>${calYear}年 ${calMonth+1}月</b>
        <div class="cal-nav"><button onclick="calNav(-1)">‹</button><button onclick="calNav(1)">›</button></div>
      </div>
      <div class="cal-grid">
        <div class="cal-dow">一</div><div class="cal-dow">二</div><div class="cal-dow">三</div><div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div><div class="cal-dow">日</div>
        ${cells}
      </div>
      <div class="cal-legend">
        <span><i style="background:rgba(78,168,222,.25);border:1px solid rgba(78,168,222,.5)"></i>已打卡</span>
        <span><i style="background:rgba(224,166,59,.12);border:1px dashed rgba(224,166,59,.6)"></i>缺卡点格子补卡</span>
        <span><i style="background:var(--bg2);border:1px solid var(--acc)"></i>今天</span>
      </div>
    </div>
    <div class="rec-head">💡 点带「补」的格子，直接给那天补打卡；点有打卡的格子看当天明细。</div>`;
  await appendNoteList(box);
}

async function openChatHistory(){
  const panel=$("histPanel");
  const listBox=$("histList");
  panel.classList.remove("hidden");
  listBox.innerHTML = `<div class="hist-empty">正在找…</div>`;
  let rows=[];
  try{
    const r = await sbRetry(()=>sb.from("chat_messages")
      .select("created_at,role")
      .eq("user_id", me.id)
      .order("created_at", { ascending:false })
      .limit(1000), 3);
    if(r.error) throw r.error;
    rows = (r.data||[]).filter(x=>x.role!=="note");
  }catch(e){
    listBox.innerHTML = `<div class="hist-empty">网络不太稳，加载失败，点「📅 历史」再试一次</div>`;
    return;
  }
  const days={};
  for(const r of rows){
    const d=String(r.created_at).slice(0,10);
    days[d]=(days[d]||0)+1;
  }
  const ds=Object.keys(days).sort().reverse();
  if(!ds.length){
    listBox.innerHTML = `<div class="hist-empty">还没有聊天记录</div>`;
    return;
  }
  listBox.innerHTML = ds.map(d=>{
    const [y,m,dd]=d.split("-").map(Number);
    const w = WEEK_CN[new Date(y, m-1, dd).getDay()];
    return `<div class="hist-day" onclick="loadChatByDate('${d}')"><span>${y}年${m}月${dd}日 周${w}</span><small>${days[d]} 条</small></div>`;
  }).join("");
}
async function loadChatByDate(dstr){
  const panel=$("histPanel");
  const box=$("chatBox");
  panel.classList.add("hidden");
  viewingHistoryDate = dstr;   // 标记停在历史某天
  let list = [];
  try{
    const r = await sbRetry(()=>sb.from("chat_messages")
      .select("role,content,created_at")
      .eq("user_id", me.id)
      .gte("created_at", dstr+"T00:00:00")
      .lt("created_at", dstr+"T23:59:59.999")
      .order("created_at", { ascending:true }), 3);
    if(r.error) throw r.error;
    list = (r.data||[]).filter(m=>m.role!=="note");
  }catch(e){
    box.innerHTML="";
    const div=document.createElement("div");
    div.className="msg ai";

/* 管理员：创建指定账号（创建后自动恢复管理员登录态） */
async function adminCreateUser(){
  const acct=$("admAcct").value.trim().toUpperCase(), name=$("admName").value.trim();
  const pwd=$("admPwd").value, q=$("admQ").value.trim(), a=$("admA").value.trim();
  if(!/^[A-Z0-9]{2,12}$/.test(acct)){ $("admMsg").textContent="账号只能是 2-12 位字母或数字"; return; }
  if(!name||pwd.length<6||!q||!a){ $("admMsg").textContent="昵称、密码、密保问题、密保答案都要填完整"; return; }
  // 保存当前(管理员)会话
  const { data: { session: adminSession } } = await sb.auth.getSession();
  const { error: signErr } = await sb.auth.signUp({ email: acct+"@local.checkin", password: pwd });
  if(signErr){
    if(adminSession) await sb.auth.setSession({ access_token: adminSession.access_token, refresh_token: adminSession.refresh_token });
    $("admMsg").textContent="这个账号已被占用，换一个试试";
    return;
  }
  const salt = Math.random().toString(36).slice(2,10);
  const ah = await sha256(salt + a.toLowerCase());
  const { error: rpcErr } = await sb.rpc("register_profile", {
    p_account: acct, p_nickname: name, p_q: q, p_a_hash: ah, p_salt: salt
  });
  // 恢复管理员会话
  if(adminSession) await sb.auth.setSession({ access_token: adminSession.access_token, refresh_token: adminSession.refresh_token });
  if(rpcErr){ $("admMsg").textContent="创建失败，稍后再试一次"; return; }
  $("admMsg").classList.add("ok");
  $("admMsg").textContent = `✅ 创建成功！账号 ${acct}，初始密码 ${pwd}。把这两样发给对方即可`;
  ["admAcct","admName","admPwd","admQ","admA"].forEach(id=>$(id).value="");
}

async function adminEditNickname(u){
  const cur = u.nickname || "";
  const v = prompt("给「" + u.account + "」修改昵称，当前：" + cur, cur);
  if(v===null) return;
  const val = v.trim();
  if(!val){ alert("昵称不能为空"); return; }
  const { error } = await sb.rpc("admin_update_user", { p_target: u.id, p_new_nickname: val });
  if(error){ alert("修改失败：" + (error.message||"稍后再试")); return; }

async function adminEditPassword(u){
