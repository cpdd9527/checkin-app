async function adminEditAccount(u){
  const v = prompt("为「" + u.account + "」设置新登录账号（2-12位字母或数字）：", u.account);
  if(v===null) return;
  const val = v.trim().toUpperCase();
  if(!/^[A-Z0-9]{2,12}$/.test(val)){ alert("账号只能是 2-12 位字母或数字"); return; }
  if(val===u.account){ return; }
  const { error } = await sb.rpc("admin_update_user", { p_target: u.id, p_new_account: val });
  if(error){
    const m = error.message || "";
    alert(m.indexOf("ACCOUNT_TAKEN")>=0 ? "这个账号已被占用，换一个试试" : "修改失败，稍后再试");
    return;
  }
  alert("✅ 登录账号已改为 " + val);
  adminLoadUsers();
}

async function adminDeleteUser(u){
  const who = u.id===me.id ? "你自己" : ("「" + (u.nickname||u.account) + "」");
  if(!confirm("确定注销 " + who + " 吗？\n\n该账号的打卡记录、聊天记录将全部清空，且无法再登录。此操作不可恢复！")) return;
  if(u.role==="admin" && u.id!==me.id && !confirm("对方也是管理员，确定要注销吗？")) return;
  const { error } = await sb.rpc("admin_delete_user", { p_target: u.id });
  if(error){ alert("注销失败：" + (error.message||"稍后再试")); return; }
  if(u.id===me.id){
    alert("你的账号已注销");
    doLogout();
    return;
  }
  alert("✅ 已注销 " + (u.nickname||u.account));
  adminLoadUsers();
}

async function loadStats(){
  let rows = [];
  const box=$("statsView");
  try{
    rows = await getMyCheckins();   // 复用打卡数据层，零额外查询
  }catch(e){
    box.innerHTML = `<div class="back-row"><button class="mini-btn" onclick="showMineHome()">← 返回我的</button></div><div class="rec-empty">统计加载失败，自动重试过还是没连上，稍后再试试</div>`;
    return;
  }
  const list = rows;
  const today = todayStr();
  // 训练项目：优先叫"锻炼"的项目，否则第一个设了课表的项目
  const trainProj = myProjects.find(p=>p.name==="锻炼") || myProjects.find(p=>plansByProj[p.id] && Object.keys(plansByProj[p.id]).some(d=>plansByProj[p.id][d] && plansByProj[p.id][d].title)) || null;
  const trainRows = trainProj ? list.filter(r=>r.project_id===trainProj.id) : [];
  const trainDates = new Set(trainRows.map(r=>r.date));
  const wp = trainProj && plansByProj[trainProj.id] ? plansByProj[trainProj.id] : {};
  const hasTrainPlan = trainProj && Object.keys(wp).some(d=>wp[d] && wp[d].title);
  // 连续训练日：按课表走，训练日打卡才算，休息日自动跳过不断
  let streak=0;
  if(hasTrainPlan){
    const dd2=new Date();
    for(let i=0;i<730;i++){
      const dw = dd2.getDay();
      if(wp[dw] && wp[dw].title){
        if(trainDates.has(todayStr(dd2))) streak++;
        else break;
      }
      dd2.setDate(dd2.getDate()-1);
    }
  } else {
    // 没有课表时回退：任意打卡连续天数
    const allDates = new Set(list.map(r=>r.date));
    const dd2=new Date();
    while(allDates.has(todayStr(dd2))){ streak++; dd2.setDate(dd2.getDate()-1); }
  }
  const streakLabel = hasTrainPlan ? "连续训练日（个）" : "连续打卡（天）";
  // 本周打卡
  const now=new Date(); const dow=(now.getDay()+6)%7; // 周一=0
  const monday=new Date(now); monday.setDate(now.getDate()-dow);
  let weekCount=0;
  for(const r of list){ const dd=new Date(r.date); if(dd>=monday) weekCount++; }
  const weekTotal = 7;
  // 近14天
  const days=[]; const labels=[]; const counts=[];
  for(let i=13;i>=0;i--){
    const dd=new Date(); dd.setDate(dd.getDate()-i);
    const s=todayStr(dd);
    labels.push((dd.getMonth()+1)+"/"+dd.getDate());
    counts.push(list.filter(r=>r.date===s).length);
    days.push(s);
  }
  // 各项目（有课表的按课表算连续，无课表按天）
  const projStat = myProjects.map(p=>{
    const rows2 = list.filter(r=>r.project_id===p.id);
    let pStreak=0; const dd=new Date();
    const pWp = plansByProj[p.id] || {};
    const pHasPlan = Object.keys(pWp).some(d=>pWp[d] && pWp[d].title);
    if(pHasPlan){
      for(let i=0;i<730;i++){
        const dw = dd.getDay();
        if(pWp[dw] && pWp[dw].title){
          if(rows2.some(r=>r.date===todayStr(dd))) pStreak++;
          else break;
        }
        dd.setDate(dd.getDate()-1);
      }
    } else {
      const ds=new Set(rows2.map(r=>r.date));
      while(ds.has(todayStr(dd))){ pStreak++; dd.setDate(dd.getDate()-1); }
    }
    return { p, total: rows2.length, streak: pStreak, hasPlan: pHasPlan };
  });

  box.innerHTML = `
    <div class="back-row"><button class="mini-btn" onclick="showMineHome()">← 返回我的</button></div>
    <div class="stat-grid">
      <div class="stat-cell"><div class="v">${streak}</div><div class="k">${streakLabel}</div></div>
      <div class="stat-cell"><div class="v">${weekCount}</div><div class="k">本周打卡（次）</div></div>
      <div class="stat-cell"><div class="v">${list.length}</div><div class="k">累计打卡（次）</div></div>
      <div class="stat-cell"><div class="v">${Math.round(weekCount/weekTotal*100)}%</div><div class="k">本周完成率</div></div>
    </div>
    <div class="chart-box"><h4>近 14 天打卡趋势</h4><div id="chartTrend"></div></div>
    <div class="chart-box"><h4>打卡热力图（近 3 个月）</h4><div class="heat-box" id="chartHeat"></div></div>
    <div class="chart-box"><h4>项目占比</h4><div id="chartPie"></div></div>
    <div class="proj-list-stat">
      ${projStat.map(s=>`<div class="row"><span>${s.p.emoji||"✅"} ${s.p.name}</span><span>连续 <b>${s.streak}</b> ${s.hasPlan?"个训练日":"天"} · 共 <b>${s.total}</b> 次</span></div>`).join("")}
    </div>`;

  // 近14天趋势（CSS柱状图）
  const maxC = Math.max(1, ...counts);
  const bars = counts.map((c,i)=>`<div class="bcol"><div class="bbar" style="height:${Math.round(c/maxC*100)}%"></div><span>${labels[i].split("/")[1]}</span></div>`).join("");
  $("chartTrend").innerHTML = `<div class="bchart">${bars}</div>`;
  // 项目占比（CSS进度条）
  const totalAll = projStat.reduce((s,x)=>s+x.total,0);
  const COLORS=["#4EA8DE","#3E9B8F","#7FC4EA","#8B9BB4","#D57E8E","#A8D8F0","#A98FD0","#8FB98F"];
  const ratioHtml = totalAll>0 ? projStat.filter(s=>s.total>0).map((s,i)=>{
    const pct = Math.round(s.total/totalAll*100);
    return `<div class="ratio-row"><span>${s.p.emoji||"✅"} ${s.p.name} <b>${s.total}次</b></span><div class="ratio-track"><div class="ratio-fill" style="width:${pct}%;background:${COLORS[i%COLORS.length]}"></div></div><em>${pct}%</em></div>`;
  }).join("") : "暂无打卡数据";
  $("chartPie").innerHTML = ratioHtml;
  // 打卡热力图：近3个月月历，颜色深浅 = 当天打卡次数
  const dateCount = {};
  for(const r of list) dateCount[r.date] = (dateCount[r.date]||0)+1;
  $("chartHeat").innerHTML = buildHeat(dateCount);
}

function buildHeat(dateCount){
  const months=[];
  const now=new Date();
  for(let k=2;k>=0;k--){
    const y=now.getFullYear(), m=now.getMonth()-k;
    const d0=new Date(y,m,1);
    months.push({ y:d0.getFullYear(), m:d0.getMonth(), days:new Date(y,m+1,0).getDate(), firstDow:(d0.getDay()+6)%7 });
  }
  let html="";
  for(const mo of months){
    let cells="";
    for(let i=0;i<mo.firstDow;i++) cells+=`<div class="heat-cell"></div>`;
    for(let d=1;d<=mo.days;d++){
      const key=mo.y+"-"+String(mo.m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      const c=dateCount[key]||0;
      const cls=c===0?"":(c<3?" t1":(c<5?" t2":(c<8?" t3":" t5")));
      cells+=`<div class="heat-cell${cls}" title="${key} · ${c}次"></div>`;
    }
    html+=`<div class="heat-month">${mo.y}年${mo.m+1}月</div><div class="heat-grid">${cells}</div>`;
  }
  html+=`<div class="heat-legend">少 <i></i><i class="t1"></i><i class="t2"></i><i class="t3"></i><i class="t5"></i> 多</div>`;
  return html;
}

/* 漏卡原因归类 */
function classifyMiss(t){
  if(/忙|加班|没时间|没空|开会|应酬|出差|事多|工作|赶工/.test(t)) return {status:"忙"};
  if(/累|困|疲惫|乏|没劲|虚脱|透支/.test(t)) return {status:"累"};
  if(/病|感冒|发烧|不舒服|疼|痛|难受|例假|生理|头晕|呕吐|咳嗽/.test(t)) return {status:"生病"};
  if(/偷懒|懒|不想|摆烂|颓|emo|没心情|心情不好|拖延/.test(t)) return {status:"偷懒"};
  if(/忘|记错|错过|没想起来|忘了时间/.test(t)) return {status:"忘了"};
  return {status:"其他"};
}

/* 每月最后一天：生成月度总结（含漏卡原因复盘），一个账号每月只生成一次 */
async function tryMonthlySummary(){
  try{
    const d=new Date();
    const lastDay=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    if(d.getDate()!==lastDay) return;
    const mkey=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    const { data: existed } = await sb.from("records").select("id").eq("user_id", me.id).eq("kind","月度总结").eq("title", mkey).limit(1);
    if(existed && existed.length) return;
    const ms = mkey+"-01", me2 = mkey+"-31";
    const { data: rows } = await sb.from("checkins").select("date, project_id, meta").eq("user_id", me.id).gte("date", ms).lte("date", me2);
    const mlist = rows||[];
    const projCount={}, subjects={};
    for(const r of mlist){
      const p = myProjects.find(x=>x.id===r.project_id);
      const nm = p?p.name:"其他";
      projCount[nm]=(projCount[nm]||0)+1;
      if(nm==="学习" && r.meta && r.meta.subject) subjects[r.meta.subject]=(subjects[r.meta.subject]||0)+1;
    }
    const totalMonth = mlist.length;
    let prevTotal=0;
    try{
      const pm=new Date(d.getFullYear(), d.getMonth()-1, 1);
      const ps=pm.getFullYear()+"-"+String(pm.getMonth()+1).padStart(2,"0")+"-01";
      const pe=new Date(d.getFullYear(), d.getMonth(), 0).getDate();
      const pek=pm.getFullYear()+"-"+String(pm.getMonth()+1).padStart(2,"0")+"-"+pe;
      const { data: prows } = await sb.from("checkins").select("id").eq("user_id", me.id).gte("date", ps).lte("date", pek);
      prevTotal=(prows||[]).length;
    }catch(e){}
    const { data: mis } = await sb.from("records").select("status").eq("user_id", me.id).eq("kind","漏卡");
    const misList=mis||[];
    const misCount={};
    for(const x of misList){
      const st = (x.status==="忙"||x.status==="累"||x.status==="生病"||x.status==="偷懒"||x.status==="忘了") ? x.status : "其他";
      misCount[st]=(misCount[st]||0)+1;
    }
    const misTxt = Object.keys(misCount).length ? Object.entries(misCount).map(([k,v])=>`${k}×${v}`).join("、") : "暂无漏卡记录";
    const diff=totalMonth-prevTotal;
    const diffTxt=diff>0?`比上月多 ${diff} 次，进步明显👏`:(diff<0?`比上月少 ${-diff} 次，下个月冲回来💪`:"和上月持平，稳住✊");
    const projTxt=Object.keys(projCount).length?Object.entries(projCount).map(([k,v])=>`${k} ${v}次`).join("、"):"本月还没打卡";
    const subTxt=Object.keys(subjects).length?Object.entries(subjects).map(([k,v])=>`${k}×${v}`).join("、"):"—";
    addCard(`
      <div class="mcard">
        <div class="m-title">📊 ${mkey} 月度总结</div>
        <div class="row"><span>打卡总次数</span><b>${totalMonth} 次</b></div>
        <div class="row"><span>项目分布</span><b>${projTxt}</b></div>
        <div class="row"><span>学习科目</span><b>${subTxt}</b></div>
        <div class="row"><span>漏卡原因</span><b>${misTxt}</b></div>
      </div>`);
    addMsg(pick([
      () => `${mkey}的账结清了：${projTxt}。${diffTxt} 下个月我继续盯你😏`,
      () => `月度盘点：${projTxt}，${diffTxt}。这个月漏卡主要是：${misTxt}。知道是谁挡路，下个月就好办多了💪`,
      () => `${mkey}复盘来了：${projTxt}；漏卡原因：${misTxt}。${diffTxt}，别让我失望啊😉`,
    ])(), "ai");
    await sb.from("records").insert({ user_id: me.id, kind:"月度总结", title:mkey, status:String(totalMonth), detail:projTxt });
  }catch(err){
    console.error("monthly summary fail:", err);
  }
}
